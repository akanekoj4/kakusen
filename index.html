<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>描戦 -KAKUSEN-</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>描戦 -KAKUSEN-</h1>
  <p>2人で絵を描いて戦わせよう！</p>

  <div class="players">

    <div class="player">
      <h2>PLAYER A</h2>
      <canvas id="canvasA" width="400" height="320"></canvas>

      <div>
        <button id="clearA">全部消す</button>
        <button id="judgeA">AI判定</button>
      </div>

      <p id="resultA">判定結果：---</p>
    </div>

    <div class="player">
      <h2>PLAYER B</h2>
      <canvas id="canvasB" width="400" height="320"></canvas>

      <div>
        <button id="clearB">全部消す</button>
        <button id="judgeB">AI判定</button>
      </div>

      <p id="resultB">判定結果：---</p>
    </div>

  </div>

  <button id="battleButton">バトル開始！</button>

  <div id="battleResult">
    勝敗：---
  </div>

  <script src="script.js"></script>

</body>
</html>
